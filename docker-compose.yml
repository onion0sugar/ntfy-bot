services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      # Adres używany przez telefon i przeglądarkę.
      NTFY_BASE_URL: "http://192.168.24.90:8093"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_DEFAULT_ACCESS: "read-write"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "1000"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      NTFY_VISITOR_MESSAGE_DAILY_LIMIT: "0"
    volumes:
      - ./ntfy-data:/var/lib/ntfy
    ports:
      - "8093:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q 'true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ntfy-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Bot korzysta z wewnętrznej sieci Docker, nie z adresu hosta.
      NTFY_SERVER: http://ntfy:80
      STATE_FILE: /var/lib/ntfy-bot/state.db
    depends_on:
      ntfy:
        condition: service_healthy
    volumes:
      - ./bot-data:/var/lib/ntfy-bot
      - ./users.txt:/app/users.txt:ro
      - ./query.sql:/app/query.sql:ro
      - ./query_busy.sql:/app/query_busy.sql:ro
      - ./query22.sql:/app/query22.sql:ro
